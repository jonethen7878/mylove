<!DOCTYPE html>
<html>
<head>
    <title>PIN PAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #A71EC2;
            color: #3FF3D0;
            font-family: Times-New-Roman;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
            height: 100vh;
        }

        .person img {
            width: 250px;
        }

        .pinpad {
            text-align: center;
        }

        .speech-bubble {
            background-color: white;
            color: black;
            padding: 15px 25px;
            border-radius: 20px;
            position: relative;
            margin-bottom: 15px;
            white-space: pre-line;
            font-family: "Lobster Two";
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: transplateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        #display {
            font-size: 30px;
            margin: 20px;
        }

        button {
            width: 70px;
            height: 70px;
            margin: 5px;
            font-size: 25px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="person">

            <div class="speech-bubble">
                <span id="dialogue"></span>
            </div>
            
            <img src="https://static.vecteezy.com/system/resources/previews/024/281/507/large_2x/cute-businessman-icon-free-png.png"
                 alt="Me">
        </div>

        <div class="pinpad">
        
            <h1>Enter PIN</h1>
            <div id = "display">----</div>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <br>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <br>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <br>

            <button onclick="clear()">Clear</button>
            <button onclick="addNumber('0')">0</button>
            <button onclick="checkPin()">Enter</button>

            <p id="message"></p>
            <p id="hint"></p>
        </div>
    </div>
        

    <script>
        let pin = "";
        let wrongAttempts = 0;

        function addNumber(number) {
            if (pin.length < 4) {
                pin += number;
                document.getElementById("display").textContent = "*".repeat(pin.length);
            }
        }

        function clearPin() {
            pin = "";
            document.getElementById("display").textContent = "----";
            document.getElementById("message").textContent = "";
        }

        function checkPin() {
            if (pin === "1220") {
                document.getElementById("message").textContent = "Correct PIN!";
            } else {
                wrongAttempts++;
                
                document.getElementById("message").textContent = "Incorrect PIN!";

                if (wrongAttempts >= 2) {
                    document.getElementById("hint").textContent = "Hint: The PIN is a special day!";
                }
                
                pin = "";
                document.getElementById("display").textContent = "----";
            }
        }       

        let text = "Heyyy babeee welcome to a little adventure!\nGuess the PIN to get more information!"
        let index = 0;

        function typeText() {
            if (index < text.length) {
                document.getElementById("dialogue").textContent += text.charAt(index);
                index++;

                setTimeout(typeText, 100);
            }
        }
        
        typeText();
    </script>
</body>
</html>
