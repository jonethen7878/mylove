<!DOCTYPE html>
<html>
<head>
    <title>Challenge 2</title>

    <style> 
        body {
            background-color: black;
            color: white;
            font-family: "Times New Roman", Times, serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .quiz {
            text-align: center;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 600px;
            margin: 0 auto;
        }

        .answers button {
            height: 80px;
            font-size: 22px;
        }

        h1 {
            font-size: 40px;
            text-align: center;
        }

        p {
            font-size: 25px;
            text-align: center;
        }

        button {
            font-size: 20px;
            padding: 10px 25px;
            margin: 10px;
        }
    </style>
</head>
    
<body>
    <div class="quiz">
        <h1>Welcome to Challenge #2! <br> It's Quiz Time!</h1>

        <p>Question 1</p>
        <p>What is my favorite color?</p>

        <div class="answers">
            <button>Answer 1</button>
            <button>Answer 2</button>
            <button>Answer 3</button>
            <button>Answer 4</button>
        </div>
    </div>
    
</body>
</html>
