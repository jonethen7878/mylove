<!DOCTYPE html>
<html>
<head>
    <title>Challenge 2</title>

    <style> 
        body {
            background-color: #6E6E6E;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .quiz {
            text-align: center;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 600px;
            margin: 0 auto;
        }

        .answers button {
            height: 80px;
            font-size: 22px;
        }

        .question-left,
        .question-right {
            position: absolute;
            width: 60px;
            height: 60px;
        }

        .question-left {
            left: -30px;
            bottom: -40px;
        }

        .question-right {
            right: -30px;
            bottom: -40px;
        }

        h1 {
            font-size: 40px;
            text-align: center;

            background-color: #3A3A3A;
            color: white;

            border: 3px solid #3FF3D0;
            border-radius: 20px;

            padding: 20px 40px;
            margin-bottom: 40px;

            background-color: #151515;

            box-shadow: 0 0 15px #3FF3D0;
        }

        p {
            font-size: 25px;
            text-align: center;
        }

        button {
            font-size: 20px;
            padding: 10px 25px;
            margin: 10px;
        }
    </style>
</head>
    
<body>
    <div class="quiz">
        <h1>Welcome to Challenge #2! <br> It's Quiz Time!</h1>

        <img class="question-left" src="images/question">
        <img class="question-right" src="images/question">

        <p>Question 1</p>
        <p>What is my favorite color?</p>

        <div class="answers">
            <button>Answer 1</button>
            <button>Answer 2</button>
            <button>Answer 3</button>
            <button>Answer 4</button>
        </div>
    </div>
    
</body>
</html>
